          if ('description' in patch) updated.description = patch.description || '';
          if ('subtasks' in patch)    updated.subtasks    = patch.subtasks || [];
          if ('impact' in patch)      updated.impact      = patch.impact;
          if ('effort' in patch)      updated.effort      = patch.effort;
          return updated;
        }

        setTasks(prev => prev.map(t => t.id === id ? applyPatch(t) : t));
        setDetailTask(prev => (!prev || prev.id !== id) ? prev : applyPatch(prev));

        if (isDemo) return;
        const { error } = await sb.from('tasks').update(patch).eq('id', id);
        if (error) {
          const missingScoreColumns = /column|schema/i.test(error.message) && ('impact' in patch || 'effort' in patch);
          showError('Failed to save: ' + error.message + (missingScoreColumns ? ' — run the scoring migration from the README.' : ''));
        }
      }

      async function handleLogout() {
        await sb.auth.signOut();
      }

      const overdueCount = tasks.filter(t => t.status !== 'done' && isOverdue(t.dueDate)).length;

      function getColumnTasks(status) {
        if (!overdueFilter) return tasks.filter(t => t.status === status);
        if (status === 'done') return [];
        return tasks.filter(t => t.status === status && isOverdue(t.dueDate));
      }

      const activeTasks = tasks.filter(t => t.status !== 'done');
      const activeCount = activeTasks.length;
      const unscoredCount = activeTasks.filter(t => !isScored(t)).length;
      const quickWinCount = activeTasks.filter(t => quadrantOf(t) === 'quickwin').length;
      const wipCount = tasks.filter(t => t.status === 'inprogress').length;
      const visibleStatuses = overdueFilter ? ['todo', 'inprogress'] : STATUSES;

      return (
        <div className="min-h-screen flex flex-col">
          {/* Demo banner — non-dismissable, pinned to top */}
          {isDemo && <DemoBanner onExitDemo={onExitDemo} />}

          <div className="px-6 py-10 max-w-6xl mx-auto w-full flex-1">
            <ErrorBanner message={error} onClose={dismissError} />

            {/* Header */}
            <div className="mb-8 flex items-start justify-between gap-4">
              <div>
                <h1 className="font-display text-3xl font-800 text-stone-900 tracking-tight mb-1">Task Board</h1>
                <p className="font-mono text-xs text-stone-400">
                  {loading ? 'Loading…' : `${tasks.length} task${tasks.length !== 1 ? 's' : ''} total`}
                </p>
              </div>
              <div className="flex items-center gap-2 pt-1 shrink-0 flex-wrap justify-end">

                {/* Overdue filter button */}
                <button
                  onClick={() => setOverdueFilter(f => !f)}
                  disabled={loading}
                  title={overdueFilter ? 'Clear overdue filter' : 'Show overdue tasks only'}
                  className={`flex items-center gap-2 font-mono text-xs px-3 py-1.5 rounded-lg border transition-all shadow-sm disabled:opacity-40 disabled:cursor-not-allowed
                    ${overdueFilter
                      ? 'bg-red-600 text-white border-red-700 hover:bg-red-700 overdue-active'
                      : overdueCount > 0
                        ? 'bg-red-50 text-red-700 border-red-200 hover:bg-red-100 hover:border-red-300'
                        : 'bg-white text-stone-500 border-stone-200 hover:bg-stone-100'
                    }`}
                >
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <circle cx="6" cy="6" r="5" stroke="currentColor" strokeWidth="1.3"/>
                    <line x1="6" y1="3.5" x2="6" y2="6.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                    <circle cx="6" cy="8.2" r="0.7" fill="currentColor"/>
                  </svg>
                  Overdue
                  {overdueCount > 0 && (
                    <span className={`font-mono text-[10px] font-medium px-1.5 py-0.5 rounded-full min-w-[18px] text-center
                      ${overdueFilter ? 'bg-white text-red-600' : 'bg-red-500 text-white'}`}>
                      {overdueCount}
                    </span>
                  )}
                </button>

                <button onClick={() => runAnalysis('rank')} disabled={aiLoading || loading || activeCount === 0}
                  title={activeCount === 0 ? 'No active tasks to analyze' : 'Get a ranked execution order with reasoning'}
                  className="flex items-center gap-2 font-mono text-xs border border-amber-300 bg-amber-50 text-amber-800 px-3 py-1.5 rounded-lg hover:bg-amber-100 hover:border-amber-400 transition-colors shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                  {aiLoading ? (
                    <><span className="spinner" style={{borderColor:'rgba(180,83,9,0.3)', borderTopColor:'#b45309'}}></span>Analyzing…</>
                  ) : (
                    <>
                      <svg width="12" height="12" viewBox="0 0 14 14" fill="none" className="text-amber-500">
                        <path d="M7 1L8.5 5.5L13 7L8.5 8.5L7 13L5.5 8.5L1 7L5.5 5.5L7 1Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" fill="currentColor" fillOpacity="0.2"/>
                      </svg>
                      AI Rank
                    </>
                  )}
                </button>

                <button onClick={() => setSprintSetupOpen(o => !o)} disabled={aiLoading || loading || activeCount === 0}
                  title={activeCount === 0 ? 'No active tasks to plan with' : 'Plan a sprint within an effort budget'}
                  className={`flex items-center gap-2 font-mono text-xs border px-3 py-1.5 rounded-lg transition-colors shadow-sm disabled:opacity-40 disabled:cursor-not-allowed
                    ${sprintSetupOpen
                      ? 'bg-indigo-600 text-white border-indigo-700'
                      : 'border-indigo-300 bg-indigo-50 text-indigo-800 hover:bg-indigo-100 hover:border-indigo-400'}`}>
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <rect x="1" y="2" width="10" height="9" rx="1.5" stroke="currentColor" strokeWidth="1.2" fill="none"/>
                    <path d="M3.5 6.5l1.7 1.7L8.7 5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                  Plan Sprint
                </button>

                {/* Email shown for real users only */}
                {!isDemo && (
                  <span className="font-mono text-xs text-stone-400 hidden sm:block truncate max-w-[180px]">{user.email}</span>
                )}

                {/* Sign Out (real users) vs Exit Demo */}
                {isDemo ? (
                  <button onClick={onExitDemo}
                    className="font-mono text-xs text-stone-500 border border-stone-200 bg-white px-3 py-1.5 rounded-lg hover:bg-stone-100 hover:text-stone-800 transition-colors shadow-sm">
                    Exit Demo
                  </button>
                ) : (
                  <button onClick={handleLogout}
                    className="font-mono text-xs text-stone-500 border border-stone-200 bg-white px-3 py-1.5 rounded-lg hover:bg-stone-100 hover:text-stone-800 transition-colors shadow-sm">
                    Sign out
                  </button>
                )}
              </div>
            </div>

            {/* Backlog health */}
            {!loading && tasks.length > 0 && (
              <div className="mb-5 flex items-center gap-2 flex-wrap">
                <span className="font-mono text-[10px] text-stone-400 uppercase tracking-widest mr-1">Backlog health</span>
                <span className="font-mono text-[11px] px-2.5 py-1 rounded-full border bg-white border-stone-200 text-stone-500 shadow-sm">
                  {activeCount} active
                </span>
                <button
                  onClick={() => { if (overdueCount > 0) { setView('board'); setOverdueFilter(true); } }}
                  disabled={overdueCount === 0}
                  title={overdueCount > 0 ? 'Show overdue tasks on the board' : 'Nothing overdue'}
                  className={`font-mono text-[11px] px-2.5 py-1 rounded-full border shadow-sm transition-colors ${
                    overdueCount > 0
                      ? 'bg-red-50 border-red-200 text-red-700 hover:bg-red-100 cursor-pointer'
                      : 'bg-white border-stone-200 text-stone-400 cursor-default'
                  }`}>
                  {overdueCount} overdue
                </button>
                <button
                  onClick={() => { if (unscoredCount > 0) setView('matrix'); }}
                  disabled={unscoredCount === 0}
                  title={unscoredCount > 0 ? 'Score these on the Priority Matrix' : 'Everything is scored'}
                  className={`font-mono text-[11px] px-2.5 py-1 rounded-full border shadow-sm transition-colors ${
                    unscoredCount > 0
                      ? 'bg-amber-50 border-amber-200 text-amber-700 hover:bg-amber-100 cursor-pointer'
                      : 'bg-white border-stone-200 text-stone-400 cursor-default'
                  }`}>
                  {unscoredCount} unscored
                </button>
                <button
                  onClick={() => { if (quickWinCount > 0) setView('matrix'); }}
                  disabled={quickWinCount === 0}
                  title="High impact, low effort — see them on the matrix"
                  className={`font-mono text-[11px] px-2.5 py-1 rounded-full border shadow-sm transition-colors ${
                    quickWinCount > 0
                      ? 'bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100 cursor-pointer'
                      : 'bg-white border-stone-200 text-stone-400 cursor-default'
                  }`}>
                  {quickWinCount} quick win{quickWinCount === 1 ? '' : 's'}
                </button>
                {wipCount > 3 && (
                  <span className="font-mono text-[11px] px-2.5 py-1 rounded-full border bg-red-50 border-red-200 text-red-700 shadow-sm"
                    title="More than 3 tasks in progress — consider finishing before starting">
                    WIP high · {wipCount} in progress
                  </span>
                )}
              </div>
            )}

            {/* View switch */}
            <div className="mb-6">
              <div className="inline-flex bg-white border border-stone-200 rounded-xl p-1 shadow-sm">
                {[['board', 'Board'], ['matrix', 'Priority Matrix']].map(([key, label]) => (
                  <button key={key} onClick={() => setView(key)}
                    className={`font-mono text-xs px-4 py-1.5 rounded-lg transition-colors ${view === key ? 'bg-stone-900 text-white shadow-sm' : 'text-stone-500 hover:text-stone-800'}`}>
                    {label}
                  </button>
                ))}
              </div>
            </div>

            {/* Sprint capacity setup */}
            {sprintSetupOpen && (
              <div className="card-enter mb-6 bg-white border border-indigo-200 rounded-2xl shadow-sm px-5 py-4 flex items-end gap-4 flex-wrap">
                <div className="flex flex-col gap-1.5">
                  <label className="font-mono text-[11px] text-stone-400 uppercase tracking-widest">Sprint capacity</label>
                  <div className="flex items-center gap-2">
                    <input type="number" min="3" max="60" value={sprintCapacity}
                      onChange={e => setSprintCapacity(Math.max(1, Number(e.target.value) || 0))}
                      className="font-mono text-sm bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-stone-700 w-24" />
                    <span className="font-mono text-xs text-stone-400">effort points</span>
                  </div>
                </div>
                <p className="font-mono text-[11px] text-stone-400 leading-relaxed flex-1 min-w-48 pb-1">
                  The AI commits tasks to the sprint within this budget and explicitly defers the rest — with reasoning for both.
                </p>
                <div className="flex gap-2 pb-0.5">
                  <button onClick={() => setSprintSetupOpen(false)}
                    className="font-mono text-xs text-stone-400 hover:text-stone-600 px-3 py-2 transition-colors">Cancel</button>
                  <button onClick={() => runAnalysis('sprint', sprintCapacity)} disabled={aiLoading}
                    className="font-mono text-xs bg-indigo-600 text-white px-4 py-2 rounded-xl hover:bg-indigo-700 active:scale-95 transition-all disabled:opacity-50">
                    Generate plan
                  </button>
                </div>
              </div>
            )}

            {/* AI Plan / Rank panel */}
            {aiRecord && !aiLoading && (
              <AIPlanPanel
                record={aiRecord}
                isStale={!loading && planSignature(tasks) !== aiRecord.snapshot}
                onDismiss={dismissAnalysis}
                onRerun={rerunAnalysis}
                onOpenTask={openTaskById}
              />
            )}

            {view === 'board' && (<>

            {/* Overdue filter active indicator */}
            {overdueFilter && (
              <div className="confirm-banner mb-6 flex items-center justify-between gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
                <div className="flex items-center gap-2">
                  <svg width="13" height="13" viewBox="0 0 12 12" fill="none" className="text-red-500 shrink-0">
                    <circle cx="6" cy="6" r="5" stroke="currentColor" strokeWidth="1.3"/>
                    <line x1="6" y1="3.5" x2="6" y2="6.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                    <circle cx="6" cy="8.2" r="0.7" fill="currentColor"/>
                  </svg>
                  <p className="font-mono text-xs text-red-700">
                    Showing {overdueCount} overdue task{overdueCount !== 1 ? 's' : ''} — Done column hidden
                  </p>
                </div>
                <button onClick={() => setOverdueFilter(false)}
                  className="font-mono text-xs text-red-500 hover:text-red-700 underline underline-offset-2 transition-colors shrink-0">
                  Clear filter
                </button>
              </div>
            )}

            {/* Add Task Form */}
            <form onSubmit={addTask} className="flex gap-3 mb-10 flex-wrap">
              <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="New task title…"
                className="flex-1 font-mono text-sm bg-white border border-stone-200 rounded-xl px-4 py-3 text-stone-800 placeholder-stone-300 shadow-sm transition-shadow min-w-40" />
              <button type="submit"
                className="font-display font-600 text-sm bg-stone-900 text-white px-6 py-3 rounded-xl hover:bg-stone-700 active:scale-95 transition-all shadow-sm">
                Add
              </button>
            </form>

            {/* Columns */}
            {loading ? (
              <div className={`grid grid-cols-1 gap-5 ${overdueFilter ? 'md:grid-cols-2' : 'md:grid-cols-3'}`}>
                {visibleStatuses.map(s => (
                  <div key={s} className={`flex flex-col bg-stone-50 rounded-2xl shadow-sm border border-stone-200 ${COLUMN_META[s].colClass} overflow-hidden`}>
                    <div className="flex items-center justify-between px-5 py-4 border-b border-stone-100">
                      <h2 className="font-display font-700 text-stone-800 text-base tracking-tight">{COLUMN_META[s].label}</h2>
                    </div>
                    <div className="p-4">
                      <div className="h-16 bg-stone-100 rounded-xl animate-pulse" />
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className={`grid grid-cols-1 gap-5 ${overdueFilter ? 'md:grid-cols-2' : 'md:grid-cols-3'}`}>
                {visibleStatuses.map(status => (
                  <Column
                    key={status}
                    status={status}
                    tasks={getColumnTasks(status)}
                    onMove={moveTask}
                    onDelete={deleteTask}
                    onEdit={editTask}
                    onOpenDetail={t => setDetailTask(t)}
                    onDragStart={id => { setDraggingId(id); draggingIdRef.current = id; }}
                    onDragEnd={() => { setDraggingId(null); draggingIdRef.current = null; }}
                    onDrop={targetStatus => {
                      const id = draggingIdRef.current;
                      if (id) {
                        dragDropTask(id, targetStatus);
                        setDraggingId(null);
                        draggingIdRef.current = null;
                      }
                    }}
                    draggingId={draggingId}
                  />
                ))}
              </div>
            )}

            </>)}

            {view === 'matrix' && !loading && (
              <MatrixView tasks={tasks} onOpenTask={t => setDetailTask(t)} />
            )}

            {/* Detail Modal */}
            {detailTask && (
              <TaskDetailModal
                task={detailTask}
                onClose={() => setDetailTask(null)}
                onSave={patchTask}
                onMoveStatus={moveTaskToStatus}
                showError={showError}
              />
            )}
          </div>
        </div>
      );
    }

    /* ── App (auth gate) ──────────────────────────────── */
    function App() {
      const [user, setUser] = React.useState(null);
      // ?demo=1 deep-links straight into demo mode — used by the portfolio so
      // a visitor lands inside the product instead of on the auth screen.
      const [isDemo, setIsDemo] = React.useState(() => new URLSearchParams(window.location.search).get('demo') === '1');

      React.useEffect(() => {
        sb.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? false);
        });

        const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
          setUser(session?.user ?? false);
          // Exit demo only on an actual sign-out — the initial auth event also
          // has a null session and must not cancel a ?demo=1 deep link.
          if (event === 'SIGNED_OUT') setIsDemo(false);
        });

        return () => subscription.unsubscribe();
      }, []);

      function handleEnterDemo() {
        setIsDemo(true);
      }

      function handleExitDemo() {
        setIsDemo(false);
        if (window.location.search) window.history.replaceState(null, '', window.location.pathname);
      }

      // Loading state
      if (user === null && !isDemo) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <p className="font-mono text-xs text-stone-400">Loading…</p>
          </div>
        );
      }

      // Demo mode (bypasses auth entirely)
      if (isDemo) {
        return (
          <TaskBoard
            user={{ email: 'demo@preview' }}
            isDemo={true}
            onExitDemo={handleExitDemo}
          />
        );
      }

      // Not authed → show auth form
      if (user === false) {
        return <AuthForm onEnterDemo={handleEnterDemo} />;
      }

      // Authed → normal board
      return <TaskBoard user={user} isDemo={false} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
