<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Board — AI Product Planning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            mono: ['DM Mono', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f5f3ee;
      background-image:
        radial-gradient(circle at 20% 20%, #e8e2d9 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, #ddd5c8 0%, transparent 60%);
      min-height: 100vh;
    }

    .card-enter { animation: slideIn 0.2s ease-out; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-card { transition: box-shadow 0.15s ease, transform 0.15s ease; }
    .task-card:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.09); }

    .col-todo       { border-top: 3px solid #3b82f6; }
    .col-inprogress { border-top: 3px solid #f59e0b; }
    .col-done       { border-top: 3px solid #10b981; }

    .badge-todo       { background: #dbeafe; color: #1d4ed8; }
    .badge-inprogress { background: #fef3c7; color: #b45309; }
    .badge-done       { background: #d1fae5; color: #065f46; }

    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      outline: none;
      box-shadow: 0 0 0 2px #3b82f6;
    }
    button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
    input[type="date"] { color-scheme: light; }

    @keyframes authFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-card { animation: authFadeIn 0.25s ease-out; }

    @keyframes panelSlideIn {
      from { opacity: 0; transform: translateY(-10px); max-height: 0; }
      to   { opacity: 1; transform: translateY(0); max-height: 600px; }
    }
    .ai-panel { animation: panelSlideIn 0.25s ease-out forwards; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      animation: spin 0.8s linear infinite;
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
    }
    .groq-response { white-space: pre-wrap; }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes backdropIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .modal-backdrop { animation: backdropIn 0.18s ease-out forwards; }
    .modal-panel    { animation: modalIn 0.22s ease-out forwards; }

    .subtask-check {
      appearance: none; -webkit-appearance: none;
      width: 15px; height: 15px;
      border: 1.5px solid #d6d3cd; border-radius: 4px;
      background: white; cursor: pointer; flex-shrink: 0;
      margin-top: 1px; position: relative;
      transition: background 0.12s, border-color 0.12s;
    }
    .subtask-check:checked { background: #1c1917; border-color: #1c1917; }
    .subtask-check:checked::after {
      content: '';
      position: absolute; top: 2px; left: 4px;
      width: 5px; height: 8px;
      border: 1.5px solid white; border-top: none; border-left: none;
      transform: rotate(45deg);
    }
    .subtask-done-text { text-decoration: line-through; color: #a8a29e; }

    @keyframes confirmIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .confirm-banner { animation: confirmIn 0.2s ease-out; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-5px); }
      40%       { transform: translateX(5px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }
    .field-invalid { box-shadow: 0 0 0 2px #ef4444 !important; animation: shake 0.35s ease-out; }

    @keyframes overdueGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50%       { box-shadow: 0 0 0 4px rgba(239,68,68,0.1); }
    }
    .overdue-active { animation: overdueGlow 2s ease-in-out infinite; }

    .task-card.dragging { opacity: 0.4; cursor: grabbing; }
    .task-card[draggable="true"] { cursor: grab; }
    .column-drop-target { transition: background 0.15s, border-color 0.15s, box-shadow 0.15s; }
    .column-drop-target.drag-over {
      background-color: #eef2ff !important;
      border-color: #818cf8 !important;
      box-shadow: inset 0 0 0 2px #818cf8;
    }

    /* Demo banner */
    .demo-banner {
      background: linear-gradient(90deg, #1c1917 0%, #292524 100%);
    }

    /* Priority Matrix */
    .matrix-dot {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      background: none; border: none; padding: 0;
      cursor: pointer;
      z-index: 1;
    }
    .matrix-dot:hover, .matrix-dot:focus-visible { z-index: 20; }
    .matrix-dot .dot {
      display: block;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-sizing: border-box;
      transition: transform 0.12s ease;
      position: relative;
    }
    .matrix-dot:hover .dot { transform: scale(1.4); }
    .matrix-dot .dot-overdue {
      position: absolute;
      top: -4px; right: -4px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      border: 1.5px solid #fff;
    }
    .matrix-dot .dot-label {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      left: calc(100% + 7px);
      font-family: 'DM Mono', monospace;
      font-size: 10.5px;
      color: #57534e;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(28,25,23,0.06);
      border-radius: 6px;
      padding: 1px 6px;
      white-space: nowrap;
      transition: color 0.12s, box-shadow 0.12s;
    }
    .matrix-dot .dot-label.left {
      left: auto;
      right: calc(100% + 7px);
    }
    .matrix-dot:hover .dot-label {
      color: #1c1917;
      background: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .matrix-corner {
      position: absolute;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { createClient } = supabase;
    const sb = createClient(
      'https://uqbvpytbqvlubuekgcbz.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxYnZweXRicXZsdWJ1ZWtnY2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NDgwMzcsImV4cCI6MjA5MTAyNDAzN30._SvaS0J-geH725suru-0Gd0S53QuJ1Rd2Sevtg5Bg1E'
    );

    /* ── Demo data ────────────────────────────────────── */
    /* Dates are relative to "today" so the demo board never goes stale.

    const demoDay = offset => {

      { id: 't2', title: 'Add CSV export to reports', status: 'todo', priority: 'medium', dueDate: demoDay(9), impact: 4, effort: 2, description: 'Top request from three enterprise accounts. Unblocks their month-end reporting without support tickets.', subtasks: [] },
      { id: 't3', title: 'Draft Q3 OKRs', status: 'inprogress', priority: 'high', dueDate: demoDay(4), impact: 4, effort: 2, description: 'First draft of Q3 objectives for leadership review. Anchor on activation and retention metrics.', subtasks: [{ id: 's3', text: 'Collect team inputs', done: true }, { id: 's4', text: 'Write draft objectives', done: true }, { id: 's5', text: 'Review with design + eng leads', done: false }] },

      { id: 't5', title: 'Self-serve plan upgrades', status: 'todo', priority: 'medium', dueDate: demoDay(30), impact: 5, effort: 5, description: 'Move upgrades out of the sales-assisted flow. Big revenue lever, big surface area: billing, entitlements, comms.', subtasks: [] },
      { id: 't6', title: 'Usage-based pricing experiment', status: 'todo', priority: 'medium', dueDate: demoDay(35), impact: 4, effort: 4, description: 'Test a metered tier with 20 design partners. Needs metering, a pricing page variant, and a rollback plan.', subtasks: [] },
      // Fill-ins

      { id: 't8', title: 'Update API docs for v2 endpoints', status: 'inprogress', priority: 'medium', dueDate: demoDay(6), impact: 3, effort: 2, description: 'Two integration partners hit breaking differences this sprint — the reference still documents v1.', subtasks: [{ id: 's9', text: 'Audit changed endpoints', done: true }, { id: 's10', text: 'Rewrite auth section', done: false }] },
      { id: 't9', title: 'Archive stale feature flags', status: 'todo', priority: 'low', dueDate: demoDay(18), impact: 2, effort: 2, description: '14 flags are fully rolled out but still in code. Cleanup reduces config risk.', subtasks: [] },
      { id: 't10', title: 'Sprint 24 retro action items', status: 'inprogress', priority: 'medium', dueDate: demoDay(-2), impact: 3, effort: 1, description: 'Document and assign the three follow-ups from retro. Already overdue.', subtasks: [{ id: 's11', text: 'Collect retro notes', done: true }, { id: 's12', text: 'Assign owners', done: false }] },
      // Time sinks
      { id: 't11', title: 'Rebuild admin panel in new framework', status: 'todo', priority: 'low', dueDate: demoDay(40), impact: 2, effort: 5, description: 'Engineering-driven rewrite request. No user-facing change; parked pending a stronger case.', subtasks: [] },
      { id: 't12', title: 'Custom theming engine', status: 'todo', priority: 'low', dueDate: demoDay(45), impact: 2, effort: 4, description: 'One large account asked for white-labeling. High build cost for a single-account need.', subtasks: [] },
      // Unscored — feed for the AI score-suggest flow
      { id: 't13', title: 'Churned-account interview synthesis', status: 'todo', priority: 'high', dueDate: demoDay(-1), impact: null, effort: null, description: 'Synthesize 6 churn interviews into the top 3 cancellation drivers. Input for the Q3 retention bet.', subtasks: [{ id: 's13', text: 'Transcribe interviews', done: true }, { id: 's14', text: 'Tag themes', done: true }, { id: 's15', text: 'Write synthesis doc', done: false }] },
      { id: 't14', title: 'Competitive pricing teardown', status: 'inprogress', priority: 'medium', dueDate: demoDay(7), impact: null, effort: null, description: 'Document packaging and pricing for the top 5 competitors ahead of the pricing experiment.', subtasks: [] },
      // Done
      { id: 't15', title: 'Ship v2.4 release notes', status: 'done', priority: 'medium', dueDate: demoDay(-5), impact: 2, effort: 1, description: 'Customer-facing notes covering the new dashboard and export fixes.', subtasks: [] },
      { id: 't16', title: 'Q2 metrics review for the board', status: 'done', priority: 'high', dueDate: demoDay(-8), impact: 4, effort: 2, description: 'Quarterly product metrics pack: activation, retention, NRR.', subtasks: [{ id: 's16', text: 'Pull metrics', done: true }, { id: 's17', text: 'Build deck', done: true }] },
    ];

    /* ── DB row → app task ───────────────────────────── */
    function rowToTask(row) {
      return {
        id:          row.id,
        title:       row.title,
        status:      row.status,
        priority:    row.priority,
        dueDate:     row.due_date || '',
        description: row.description || '',
        subtasks:    Array.isArray(row.subtasks) ? row.subtasks : [],
        impact:      Number.isInteger(row.impact) ? row.impact : null,
        effort:      Number.isInteger(row.effort) ? row.effort : null,
      };
    }

    const STATUSES = ['todo', 'inprogress', 'done'];
    const COLUMN_META = {
      todo:       { label: 'To Do',       colClass: 'col-todo',       badgeClass: 'badge-todo' },
      inprogress: { label: 'In Progress', colClass: 'col-inprogress', badgeClass: 'badge-inprogress' },
      done:       { label: 'Done',        colClass: 'col-done',       badgeClass: 'badge-done' },
    };

    const PRIORITIES = ['low', 'medium', 'high'];
    const PRIORITY_META = {
      low:    { label: 'Low',    badgeClass: 'bg-stone-100 text-stone-500' },
      medium: { label: 'Medium', badgeClass: 'bg-blue-100 text-blue-700' },
      high:   { label: 'High',   badgeClass: 'bg-red-100 text-red-600' },
    };

    /* ── Impact / Effort scoring ──────────────────────── */
    const SCORE_SCALE = [1, 2, 3, 4, 5];

    function isScored(t) {
      return Number.isInteger(t.impact) && Number.isInteger(t.effort);
    }

    /* Quadrant boundary sits at the scale midpoint (3):
       impact > 3 counts as high impact, effort <= 3 as low effort. */
    function quadrantOf(t) {
      if (!isScored(t)) return null;
      const highImpact = t.impact > 3;
      const lowEffort  = t.effort <= 3;
      if (highImpact && lowEffort)  return 'quickwin';
      if (highImpact && !lowEffort) return 'bigbet';
      if (!highImpact && lowEffort) return 'fillin';
      return 'timesink';
    }

    const QUADRANT_META = {
      quickwin: { label: 'Quick Win', chipClass: 'bg-emerald-100 text-emerald-700', dot: '#10b981', tint: 'rgba(16,185,129,0.05)',  labelColor: '#047857' },
      bigbet:   { label: 'Big Bet',   chipClass: 'bg-indigo-100 text-indigo-700',   dot: '#6366f1', tint: 'rgba(99,102,241,0.05)',  labelColor: '#4338ca' },
      fillin:   { label: 'Fill-in',   chipClass: 'bg-stone-200 text-stone-600',     dot: '#a8a29e', tint: 'rgba(168,162,158,0.08)', labelColor: '#78716c' },
      timesink: { label: 'Time Sink', chipClass: 'bg-red-100 text-red-600',         dot: '#ef4444', tint: 'rgba(239,68,68,0.04)',   labelColor: '#b91c1c' },
    };

    function formatDate(iso) {
      if (!iso) return null;
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function isOverdue(iso) {
      if (!iso) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d) < today;
    }

    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    /* ── Groq API calls ───────────────────────────────── */
    const GROQ_PROXY_URL = 'https://uqbvpytbqvlubuekgcbz.supabase.co/functions/v1/groq-proxy';
    const GROQ_MODEL = 'llama-3.3-70b-versatile';

    async function groqChat(prompt, maxTokens) {
      const res = await fetch(GROQ_PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [{ role: 'user', content: prompt }],
          max_tokens: maxTokens,
        }),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody?.error?.message || `Groq API error: ${res.status}`);
      }
      const data = await res.json();
      return data.choices?.[0]?.message?.content || '';
    }

    async function groqJSON(prompt, maxTokens) {
      const text = await groqChat(prompt, maxTokens);
      return JSON.parse(text.replace(/```json|```/g, '').trim());
    }

    /* AI scoring assist: the model proposes impact/effort, the human
       confirms or overrides — same contract as the rest of the AI here. */
    async function fetchScoreSuggestion(task) {
      const prompt = `You are a product planning assistant. Score this task on an impact/effort scale.

Task: "${task.title}"
${task.description ? 'Details: ' + task.description : ''}

impact: 1 (negligible user or business value) to 5 (major value)
effort: 1 (a few hours) to 5 (multiple weeks)

Return ONLY valid JSON, no markdown:
{ "impact": n, "effort": n, "rationale": "one short sentence explaining both scores" }`;
      const parsed = await groqJSON(prompt, 200);
      const clamp = v => SCORE_SCALE.includes(v) ? v : null;
      return {
        impact: clamp(parsed.impact),
        effort: clamp(parsed.effort),
        rationale: typeof parsed.rationale === 'string' ? parsed.rationale : '',
      };
    }

    /* Serialize the full signal set per task — status, priority, deadline,
       subtask progress, and impact/effort — so the model ranks on structure,
       not guesswork. */
    function serializeTasks(activeTasks) {
      return activeTasks.map((t, i) => {
        const parts = [
          `status: ${t.status}`,
          `priority: ${t.priority}`,
          t.dueDate ? `due ${t.dueDate}${isOverdue(t.dueDate) ? ' (OVERDUE)' : ''}` : 'no due date',
          t.subtasks.length ? `subtasks ${t.subtasks.filter(s => s.done).length}/${t.subtasks.length} done` : 'no subtasks',
          isScored(t) ? `impact ${t.impact}/5, effort ${t.effort}/5 (${QUADRANT_META[quadrantOf(t)].label})` : 'not scored yet',
        ];
        return `[${i + 1}] "${t.title}" — ${parts.join(', ')}`;
      }).join('\n');
    }

    async function fetchRankAnalysis(activeTasks) {
      const prompt = `You are a product planning assistant helping a product manager decide what to work on.

Active tasks:
${serializeTasks(activeTasks)}

Rank what to do first. Weigh: overdue work, impact-to-effort ratio, in-progress momentum (finishing beats starting), and deadline proximity.

Return ONLY valid JSON, no markdown:
{
  "summary": "1-2 sentences on the overall sequencing logic",
  "ranked": [{ "rank": 1, "title": "task title", "reason": "one sentence why", "taskIndex": 1 }],
  "defer": [{ "title": "task title", "reason": "one sentence why this can wait", "taskIndex": 4 }]
}
Rank at most 5 tasks in "ranked". Put 2-4 tasks in "defer". taskIndex is the [n] number above.`;
      return groqJSON(prompt, 1200);
    }

    async function fetchSprintPlan(activeTasks, capacity) {
      const prompt = `You are a product planning assistant helping a product manager plan a sprint.

Active tasks:
${serializeTasks(activeTasks)}

Sprint capacity: ${capacity} effort points. Each task costs its effort score (1-5); treat unscored tasks as effort 2 if you include them. Choose the set of tasks to commit this sprint — maximize impact within capacity, deal with overdue work, and prefer finishing in-progress tasks over starting new ones. Everything else is explicitly deferred.

Return ONLY valid JSON, no markdown:
{
  "theme": "one-line sprint goal naming what this sprint is about",
  "committed": [{ "title": "task title", "reason": "one sentence why it made the cut", "effort": n, "taskIndex": 1 }],
  "deferred": [{ "title": "task title", "reason": "one sentence why it waits", "taskIndex": 4 }],
  "totalEffort": n,
  "risk": "the single biggest risk in this plan, one sentence"
}
totalEffort is the sum of committed efforts and must not exceed ${capacity}. taskIndex is the [n] number above.`;
      return groqJSON(prompt, 1500);
    }

    /* Fingerprint of everything the AI reasons over — when it changes,
       the persisted analysis is flagged stale. */
    function planSignature(tasks) {
      return tasks
        .filter(t => t.status !== 'done')
        .map(t => [t.id, t.status, t.dueDate, t.impact, t.effort, t.subtasks.filter(s => s.done).length + '/' + t.subtasks.length].join(':'))
        .sort()
        .join('|');
    }

    function fmtRelative(iso) {
      if (!iso) return '';
      const s = Math.floor((Date.now() - new Date(iso)) / 1000);
      if (s < 60) return 'just now';
      const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    /* ── DemoBanner ───────────────────────────────────── */
    function DemoBanner({ onExitDemo }) {
      return (
        <div className="demo-banner w-full px-5 py-2.5 flex items-center justify-between gap-4">
          <div className="flex items-center gap-2.5">
            <span className="font-mono text-[10px] font-medium px-2 py-0.5 rounded-full bg-amber-400 text-stone-900 uppercase tracking-widest">Demo</span>
            <p className="font-mono text-xs text-stone-300">
              Changes are not saved
              <span className="text-stone-500 mx-2">·</span>
              <button
                onClick={onExitDemo}
                className="text-amber-400 underline underline-offset-2 hover:text-amber-300 transition-colors"
              >
                Sign up to save your work
              </button>
            </p>
          </div>
          <button
            onClick={onExitDemo}
            className="font-mono text-xs text-stone-400 border border-stone-600 px-3 py-1 rounded-lg hover:bg-stone-700 hover:text-stone-200 transition-colors shrink-0"
          >
            Exit Demo
          </button>
        </div>
      );
    }

    /* ── AuthForm ─────────────────────────────────────── */
    function AuthForm({ onEnterDemo }) {
      const [mode, setMode] = React.useState('login');
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState('');

      async function handleSubmit(e) {
        e.preventDefault();
        setError('');
        setLoading(true);
        if (mode === 'login') {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) setError(error.message);
        } else {
          const { error } = await sb.auth.signUp({ email, password });
          if (error) setError(error.message);
        }
        setLoading(false);
      }

      return (
        <div className="min-h-screen flex items-center justify-center px-4">
          <div className="auth-card w-full max-w-sm">
            <div className="mb-8 text-center">
              <h1 className="font-display text-3xl font-800 text-stone-900 tracking-tight">Task Board</h1>
              <p className="font-mono text-xs text-stone-400 mt-1">
                {mode === 'login' ? 'sign in to continue' : 'create your account'}
              </p>
            </div>
            <div className="bg-white rounded-2xl border border-stone-200 shadow-sm px-7 py-8">
              {error && (
                <div className="mb-5 font-mono text-xs text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3">{error}</div>
              )}
              <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                <div className="flex flex-col gap-1.5">
                  <label className="font-mono text-xs text-stone-500">Email</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} required placeholder="you@example.com"
                    className="font-mono text-sm bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-stone-800 placeholder-stone-300 transition-shadow" />
                </div>
                <div className="flex flex-col gap-1.5">
                  <label className="font-mono text-xs text-stone-500">Password</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} required placeholder="••••••••" minLength={6}
                    className="font-mono text-sm bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-stone-800 placeholder-stone-300 transition-shadow" />
                </div>
                <button type="submit" disabled={loading}
                  className="mt-2 font-display font-600 text-sm bg-stone-900 text-white px-6 py-3 rounded-xl hover:bg-stone-700 active:scale-95 transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                  {loading ? 'Please wait…' : mode === 'login' ? 'Sign In' : 'Sign Up'}
                </button>
              </form>

              {/* Divider */}
              <div className="flex items-center gap-3 my-5">
                <div className="flex-1 h-px bg-stone-100" />
                <span className="font-mono text-[10px] text-stone-300 uppercase tracking-widest">or</span>
                <div className="flex-1 h-px bg-stone-100" />
              </div>

              {/* Try Demo button */}
              <button
                onClick={onEnterDemo}
                className="w-full font-mono text-sm text-stone-500 border border-stone-200 bg-stone-50 px-6 py-2.5 rounded-xl hover:bg-stone-100 hover:border-stone-300 hover:text-stone-700 active:scale-95 transition-all"
              >
                Try Demo
              </button>
            </div>
            <p className="font-mono text-xs text-stone-400 text-center mt-5">
              {mode === 'login' ? "Don't have an account? " : 'Already have an account? '}
              <button onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setError(''); }}
                className="text-stone-700 underline underline-offset-2 hover:text-stone-900 transition-colors">
                {mode === 'login' ? 'Sign up' : 'Sign in'}
              </button>
            </p>
          </div>
        </div>
      );
    }

    /* ── AIPlanPanel ──────────────────────────────────── */
    /* Renders both analysis modes. Every item links back to its source
       task; the panel persists and flags itself stale when the board
       changes — the same trust contract as Pulse. */
    function AIPlanPanel({ record, isStale, onDismiss, onRerun, onOpenTask }) {
      const { mode, result, taskIds, capacity, analyzedAt } = record;
      const open = idx => { if (idx) onOpenTask(taskIds[idx - 1]); };

      function PlanItem({ children, taskIndex, tone }) {
        const tones = {
          rank:   'bg-stone-50 border-stone-200 hover:border-amber-400',
          commit: 'bg-emerald-50/60 border-emerald-200 hover:border-emerald-400',
          defer:  'bg-stone-50 border-stone-200 hover:border-stone-400',
        };
        return (
          <button onClick={() => open(taskIndex)} title="Open the underlying task"
            className={`w-full text-left border rounded-xl px-3.5 py-2.5 transition-colors ${tones[tone]}`}>
            {children}
            <span className="block font-mono text-[10px] text-amber-700/70 mt-1.5">view task →</span>
          </button>
        );
      }

      return (
        <div className="ai-panel mb-8 bg-white border border-stone-200 rounded-2xl shadow-sm overflow-hidden">
          <div className="flex items-center justify-between gap-3 px-5 py-3.5 border-b border-stone-100 bg-stone-50 flex-wrap">
            <div className="flex items-center gap-2 flex-wrap">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" className="text-amber-500">
                <path d="M7 1L8.5 5.5L13 7L8.5 8.5L7 13L5.5 8.5L1 7L5.5 5.5L7 1Z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" fill="currentColor" fillOpacity="0.15"/>
              </svg>
              <span className="font-display font-700 text-sm text-stone-800 tracking-tight">
                {mode === 'sprint' ? 'AI Sprint Plan' : 'AI Priority Analysis'}
              </span>
              <span className="font-mono text-[10px] text-stone-400 bg-stone-100 px-2 py-0.5 rounded-full">llama-3.3-70b</span>
              <span className="font-mono text-[10px] text-stone-400">
                {taskIds.length} active tasks · {fmtRelative(analyzedAt)}{mode === 'sprint' && capacity ? ` · capacity ${capacity} pts` : ''}
              </span>
              {isStale && (
                <>
                  <span className="confirm-banner font-mono text-[10px] font-medium px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">
                    Stale — board changed since this run
                  </span>
                  <button onClick={onRerun}
                    className="font-mono text-[10px] text-amber-700 underline underline-offset-2 hover:text-amber-900 transition-colors">
                    Re-run
                  </button>
                </>
              )}
            </div>
            <button onClick={onDismiss}
              className="w-6 h-6 flex items-center justify-center rounded-lg text-stone-400 hover:bg-stone-200 hover:text-stone-600 transition-colors text-base leading-none"
              title="Dismiss and clear">×</button>
          </div>

          <div className="px-5 py-4 flex flex-col gap-5">
            {mode === 'rank' ? (
              <>
                {result.summary && (
                  <p className="font-mono text-xs text-stone-500 italic leading-relaxed border-b border-stone-100 pb-3.5">{result.summary}</p>
                )}
                {result.ranked && result.ranked.length > 0 && (
                  <div>
                    <p className="font-mono text-[10px] text-stone-400 uppercase tracking-widest mb-2.5">Do first</p>
                    <div className="flex flex-col gap-2">
                      {result.ranked.map((item, i) => (
                        <PlanItem key={i} taskIndex={item.taskIndex} tone="rank">
                          <span className="flex items-start gap-2.5">
                            <span className="font-mono text-[10px] font-medium bg-stone-900 text-white px-2 py-0.5 rounded-full shrink-0 mt-0.5">#{item.rank}</span>
                            <span className="flex-1">
                              <span className="block font-mono text-sm text-stone-800">{item.title}</span>
                              <span className="block font-mono text-xs text-stone-500 mt-0.5 leading-relaxed">{item.reason}</span>
                            </span>
                          </span>
                        </PlanItem>
                      ))}
                    </div>
                  </div>
                )}
                {result.defer && result.defer.length > 0 && (
                  <div>
                    <p className="font-mono text-[10px] text-stone-400 uppercase tracking-widest mb-2.5">Can wait</p>
                    <div className="flex flex-col gap-2">
                      {result.defer.map((item, i) => (
                        <PlanItem key={i} taskIndex={item.taskIndex} tone="defer">
                          <span className="block font-mono text-sm text-stone-700">{item.title}</span>
                          <span className="block font-mono text-xs text-stone-500 mt-0.5 leading-relaxed">{item.reason}</span>
                        </PlanItem>
                      ))}
                    </div>
                  </div>
                )}
              </>
            ) : (
              <>
                {result.theme && (
                  <div className="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-3">
                    <p className="font-mono text-[10px] text-indigo-400 uppercase tracking-widest mb-1">Sprint goal</p>
                    <p className="font-display font-700 text-sm text-indigo-900 tracking-tight">{result.theme}</p>
                  </div>
                )}
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <p className="font-mono text-[10px] text-stone-400 uppercase tracking-widest">
                      Committed · {result.totalEffort || 0} of {capacity} pts
                    </p>
                  </div>
                  <div className="h-1.5 bg-stone-100 rounded-full overflow-hidden mb-3">
                    <div className={`h-full rounded-full transition-all duration-300 ${(result.totalEffort || 0) > capacity ? 'bg-red-400' : 'bg-emerald-400'}`}
                      style={{ width: `${Math.min(100, ((result.totalEffort || 0) / capacity) * 100)}%` }} />
                  </div>
                  <div className="flex flex-col gap-2">
                    {(result.committed || []).map((item, i) => (
                      <PlanItem key={i} taskIndex={item.taskIndex} tone="commit">
                        <span className="flex items-start gap-2.5">
                          <span className="font-mono text-[10px] font-medium bg-emerald-600 text-white px-2 py-0.5 rounded-full shrink-0 mt-0.5">{item.effort || '?'} pt{item.effort === 1 ? '' : 's'}</span>
                          <span className="flex-1">
                            <span className="block font-mono text-sm text-stone-800">{item.title}</span>
                            <span className="block font-mono text-xs text-stone-500 mt-0.5 leading-relaxed">{item.reason}</span>
                          </span>
                        </span>
                      </PlanItem>
                    ))}
                  </div>
                </div>
                {result.deferred && result.deferred.length > 0 && (
                  <div>
                    <p className="font-mono text-[10px] text-stone-400 uppercase tracking-widest mb-2.5">Explicitly deferred</p>
                    <div className="flex flex-col gap-2">
                      {result.deferred.map((item, i) => (
                        <PlanItem key={i} taskIndex={item.taskIndex} tone="defer">
                          <span className="block font-mono text-sm text-stone-700">{item.title}</span>
                          <span className="block font-mono text-xs text-stone-500 mt-0.5 leading-relaxed">{item.reason}</span>
                        </PlanItem>
                      ))}
                    </div>
                  </div>
                )}
                {result.risk && (
                  <p className="font-mono text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 leading-relaxed">
                    <span className="font-medium">Risk to watch:</span> {result.risk}
                  </p>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ── TaskDetailModal ──────────────────────────────── */
    function TaskDetailModal({ task, onClose, onSave, onMoveStatus, showError }) {
      const [title, setTitle] = React.useState(task.title);
      const [priority, setPriority] = React.useState(task.priority);
      const [dueDate, setDueDate] = React.useState(task.dueDate);
      const [description, setDescription] = React.useState(task.description);
      const [subtasks, setSubtasks] = React.useState(task.subtasks);
      const [newSubtask, setNewSubtask] = React.useState('');
      const [saving, setSaving] = React.useState(false);
      const [confirmDone, setConfirmDone] = React.useState(false);
      const [impact, setImpact] = React.useState(task.impact);
      const [effort, setEffort] = React.useState(task.effort);
      const [scoreSuggesting, setScoreSuggesting] = React.useState(false);
      const [scoreRationale, setScoreRationale] = React.useState('');
      const [scoreError, setScoreError] = React.useState('');
      const [validationError, setValidationError] = React.useState('');
      const [invalidFields, setInvalidFields] = React.useState([]);

      const allDone = subtasks.length > 0 && subtasks.every(s => s.done);

      React.useEffect(() => {
        if (allDone && task.status !== 'done') setConfirmDone(true);
        else setConfirmDone(false);
      }, [allDone, task.status]);

      function validateMandatoryFields() {
        const missing = [];
        const labels = [];
        if (!dueDate) { missing.push('dueDate'); labels.push('Due date'); }
        if (!description.trim()) { missing.push('description'); labels.push('Description'); }
        if (!priority) { missing.push('priority'); labels.push('Priority'); }
        if (missing.length > 0) {
          setInvalidFields(missing);
          setValidationError(`Required before closing: ${labels.join(', ')}`);
          setTimeout(() => setInvalidFields([]), 800);
          return false;
        }
        setValidationError('');
        setInvalidFields([]);
        return true;
      }

      function handleXClose() { onClose(); }

      const [saveSuccess, setSaveSuccess] = React.useState(false);
      function handleSave() {
        if (!validateMandatoryFields()) return;
        setSaveSuccess(true);
        setTimeout(onClose, 450); // fields auto-save on change; this validates and closes
      }

      React.useEffect(() => {
        function onKeyDown(e) { if (e.key === 'Escape') handleXClose(); }
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      async function save(patch) {
        setSaving(true);
        await onSave(task.id, patch);
        setSaving(false);
      }

      async function handleTitleBlur() {
        const trimmed = title.trim();
        if (!trimmed) { setTitle(task.title); return; }
        if (trimmed !== task.title) await save({ title: trimmed });
      }

      async function handlePriorityChange(e) {
        const val = e.target.value;
        setPriority(val);
        await save({ priority: val });
        setInvalidFields(prev => prev.filter(f => f !== 'priority'));
      }

      async function handleDueDateChange(e) {
        const val = e.target.value;
        setDueDate(val);
        await save({ due_date: val || null });
        if (val) setInvalidFields(prev => prev.filter(f => f !== 'dueDate'));
      }

      async function handleDescriptionBlur() {
        if (description !== task.description) await save({ description: description || null });
        if (description.trim()) setInvalidFields(prev => prev.filter(f => f !== 'description'));
      }

      async function handleImpactChange(e) {
        const val = e.target.value ? Number(e.target.value) : null;
        setImpact(val);
        await save({ impact: val });
      }

      async function handleEffortChange(e) {
        const val = e.target.value ? Number(e.target.value) : null;
        setEffort(val);
        await save({ effort: val });
      }

      async function handleSuggestScores() {
        if (scoreSuggesting) return;
        setScoreSuggesting(true); setScoreError(''); setScoreRationale('');
        try {
          const s = await fetchScoreSuggestion({ title, description });
          if (s.impact) setImpact(s.impact);
          if (s.effort) setEffort(s.effort);
          if (s.impact || s.effort) {
            await save({ impact: s.impact != null ? s.impact : impact, effort: s.effort != null ? s.effort : effort });
          }
          setScoreRationale(s.rationale || 'Scores suggested — adjust if you disagree.');
        } catch (err) {
          setScoreError('Could not suggest scores: ' + err.message);
        }
        setScoreSuggesting(false);
      }

      async function toggleSubtask(id) {
        const updated = subtasks.map(s => s.id === id ? { ...s, done: !s.done } : s);
        setSubtasks(updated);
        await save({ subtasks: updated });
      }

      async function deleteSubtask(id) {
        const updated = subtasks.filter(s => s.id !== id);
        setSubtasks(updated);
        await save({ subtasks: updated });
      }

      async function addSubtask(e) {
        e.preventDefault();
        const text = newSubtask.trim();
        if (!text) return;
        const updated = [...subtasks, { id: uid(), text, done: false }];
        setSubtasks(updated);
        setNewSubtask('');
        await save({ subtasks: updated });
      }

      async function handleMoveToDone() {
        await onMoveStatus(task.id, 'done');
        setConfirmDone(false);
        onClose();
      }

      const completedCount = subtasks.filter(s => s.done).length;

      function fieldClass(base, fieldName) {
        return `${base} ${invalidFields.includes(fieldName) ? 'field-invalid' : ''}`;
      }

      return (
        <div
          className="modal-backdrop fixed inset-0 z-50 flex items-center justify-center px-4"
          style={{ background: 'rgba(28,25,23,0.45)', backdropFilter: 'blur(4px)' }}
          onClick={e => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div className="modal-panel bg-white rounded-2xl shadow-xl border border-stone-200 w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden">
            <div className="flex items-center justify-between px-6 py-4 border-b border-stone-100">
              <div className="flex items-center gap-2">
                <span className={`font-mono text-[10px] font-medium px-2 py-0.5 rounded-full ${COLUMN_META[task.status].badgeClass}`}>
                  {COLUMN_META[task.status].label}
                </span>
                {saving && <span className="font-mono text-[10px] text-stone-400">saving…</span>}
              </div>
              <button onClick={handleXClose}
                className="w-7 h-7 flex items-center justify-center rounded-lg text-stone-400 hover:bg-stone-100 hover:text-stone-600 transition-colors text-lg leading-none"
                title="Close">×</button>
            </div>

            {validationError && (
              <div className="confirm-banner mx-6 mt-4 flex items-center gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" className="text-red-500 shrink-0">
                  <circle cx="7" cy="7" r="6" stroke="currentColor" strokeWidth="1.4"/>
                  <line x1="7" y1="4" x2="7" y2="7.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                  <circle cx="7" cy="9.5" r="0.7" fill="currentColor"/>
                </svg>
                <p className="font-mono text-xs text-red-700 flex-1">{validationError}</p>
                <button onClick={() => setValidationError('')}
                  className="font-mono text-xs text-red-400 hover:text-red-600 transition-colors shrink-0">×</button>
              </div>
            )}

            <div className="flex-1 overflow-y-auto px-6 py-5 flex flex-col gap-5">
              {confirmDone && (
                <div className="confirm-banner flex items-center justify-between gap-3 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3">
                  <p className="font-mono text-xs text-emerald-700">All subtasks complete — mark task as Done?</p>
                  <div className="flex items-center gap-2 shrink-0">
                    <button onClick={() => setConfirmDone(false)}
                      className="font-mono text-xs text-stone-400 hover:text-stone-600 transition-colors">Dismiss</button>
                    <button onClick={handleMoveToDone}
                      className="font-mono text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-700 transition-colors">
                      Move to Done
                    </button>
                  </div>
                </div>
              )}

              <div className="flex flex-col gap-1.5">
                <label className="font-mono text-[11px] text-stone-400 uppercase tracking-widest">Title</label>
                <input type="text" value={title} onChange={e => setTitle(e.target.value)} onBlur={handleTitleBlur}
                  className="font-display font-700 text-xl text-stone-900 tracking-tight bg-transparent border-b border-stone-200 pb-1 focus:border-blue-400 focus:outline-none transition-colors"
                  style={{ boxShadow: 'none' }} />
              </div>

              <div className="flex gap-4 flex-wrap">
                <div className="flex flex-col gap-1.5 flex-1 min-w-28">
                  <label className="font-mono text-[11px] text-stone-400 uppercase tracking-widest">
                    Priority <span className="text-red-400">*</span>
                  </label>
                  <select value={priority} onChange={handlePriorityChange}
                    className={fieldClass("font-mono text-sm bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-stone-700 focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer", 'priority')}>
                    {PRIORITIES.map(p => <option key={p} value={p}>{PRIORITY_META[p].label}</option>)}
                  </select>
                </div>
                <div className="flex flex-col gap-1.5 flex-1 min-w-36">
                  <label className="font-mono text-[11px] text-stone-400 uppercase tracking-widest">
                    Due Date <span className="text-red-400">*</span>
                  </label>
                  <input type="date" value={dueDate} onChange={handleDueDateChange}
                    className={fieldClass("font-mono text-sm bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-stone-700 focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer", 'dueDate')} />
                </div>
              </div>

              {/* Impact / Effort scoring */}
              <div className="flex flex-col gap-2.5 bg-stone-50 border border-stone-200 rounded-xl px-4 py-3.5">
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <label className="font-mono text-[11px] text-stone-400 uppercase tracking-widest">Impact / Effort</label>
                  {(() => {
                    const q = quadrantOf({ impact, effort });
                    return q ? (
                      <span className={`font-mono text-[10px] font-medium px-2 py-0.5 rounded-full ${QUADRANT_META[q].chipClass}`}>
                        {QUADRANT_META[q].label}
                      </span>
                    ) : (
                      <span className="font-mono text-[10px] text-stone-300">unscored</span>
                    );
                  })()}
                </div>
                <div className="flex gap-3 flex-wrap items-end">
                  <div className="flex flex-col gap-1 flex-1 min-w-28">
                    <label className="font-mono text-[10px] text-stone-400">Impact</label>
                    <select value={impact != null ? impact : ''} onChange={handleImpactChange}
                      className="font-mono text-sm bg-white border border-stone-200 rounded-xl px-3 py-2 text-stone-700 focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
                      <option value="">Not set</option>
                      <option value="1">1 · minimal</option>
                      <option value="2">2</option>
                      <option value="3">3 · meaningful</option>
                      <option value="4">4</option>
                      <option value="5">5 · major</option>
                    </select>
                  </div>
                  <div className="flex flex-col gap-1 flex-1 min-w-28">
                    <label className="font-mono text-[10px] text-stone-400">Effort</label>
                    <select value={effort != null ? effort : ''} onChange={handleEffortChange}
                      className="font-mono text-sm bg-white border border-stone-200 rounded-xl px-3 py-2 text-stone-700 focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
                      <option value="">Not set</option>
                      <option value="1">1 · hours</option>
                      <option value="2">2</option>
                      <option value="3">3 · days</option>
                      <option value="4">4</option>
                      <option value="5">5 · weeks</option>
                    </select>
                  </div>
                  <button type="button" onClick={handleSuggestScores} disabled={scoreSuggesting || !title.trim()}
                    title="Let AI suggest impact and effort from the title and description"
                    className="flex items-center gap-1.5 font-mono text-xs border border-amber-300 bg-amber-50 text-amber-800 px-3 py-2 rounded-xl hover:bg-amber-100 hover:border-amber-400 transition-colors disabled:opacity-40 disabled:cursor-not-allowed shrink-0">
                    {scoreSuggesting ? (
                      <><span className="spinner" style={{borderColor:'rgba(180,83,9,0.3)', borderTopColor:'#b45309'}}></span>Scoring…</>
                    ) : (
                      <>
                        <svg width="11" height="11" viewBox="0 0 14 14" fill="none" className="text-amber-500">
                          <path d="M7 1L8.5 5.5L13 7L8.5 8.5L7 13L5.5 8.5L1 7L5.5 5.5L7 1Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" fill="currentColor" fillOpacity="0.2"/>
                        </svg>
                        AI suggest
                      </>
                    )}
                  </button>
                </div>
                {scoreRationale && (
                  <p className="confirm-banner font-mono text-[11px] text-amber-700 leading-relaxed">✦ {scoreRationale} <span className="text-stone-400">— adjust if you disagree.</span></p>
                )}
                {scoreError && (
                  <p className="confirm-banner font-mono text-[11px] text-red-600">{scoreError}</p>
                )}
              </div>

              <div className="flex flex-col gap-1.5">
                <label className="font-mono text-[11px] text-stone-400 uppercase tracking-widest">
                  Description <span className="text-red-400">*</span>
                </label>
                <textarea value={description} onChange={e => setDescription(e.target.value)} onBlur={handleDescriptionBlur}
                  placeholder="Add a description…" rows={3}
                  className={fieldClass("font-mono text-sm bg-stone-50 border border-stone-200 rounded-xl px-4 py-3 text-stone-700 placeholder-stone-300 resize-none transition-shadow", 'description')} />
              </div>

              <div className="flex flex-col gap-2.5">
                <div className="flex items-center justify-between">
                  <label className="font-mono text-[11px] text-stone-400 uppercase tracking-widest">
                    Subtasks <span className="text-stone-300 normal-case tracking-normal">(optional)</span>
                  </label>
                  {subtasks.length > 0 && (
                    <span className="font-mono text-[11px] text-stone-400">{completedCount}/{subtasks.length}</span>
                  )}
                </div>

                {subtasks.length > 0 && (
                  <div className="h-1 bg-stone-100 rounded-full overflow-hidden">
                    <div className="h-full bg-emerald-400 rounded-full transition-all duration-300"
                      style={{ width: `${(completedCount / subtasks.length) * 100}%` }} />
                  </div>
                )}

                <div className="flex flex-col gap-1.5">
                  {subtasks.map(s => (
                    <div key={s.id} className="flex items-start gap-2.5 group py-1">
                      <input type="checkbox" checked={s.done} onChange={() => toggleSubtask(s.id)} className="subtask-check mt-0.5" />
                      <span className={`flex-1 font-mono text-sm leading-snug ${s.done ? 'subtask-done-text' : 'text-stone-700'}`}>{s.text}</span>
                      <button onClick={() => deleteSubtask(s.id)}
                        className="opacity-0 group-hover:opacity-100 w-5 h-5 flex items-center justify-center rounded text-stone-300 hover:text-red-400 hover:bg-red-50 transition-all text-sm leading-none shrink-0"
                        title="Delete subtask">×</button>
                    </div>
                  ))}
                </div>

                <form onSubmit={addSubtask} className="flex gap-2 mt-1">
                  <input type="text" value={newSubtask} onChange={e => setNewSubtask(e.target.value)}
                    placeholder="Add a subtask…"
                    className="flex-1 font-mono text-sm bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-stone-700 placeholder-stone-300 transition-shadow" />
                  <button type="submit" disabled={!newSubtask.trim()}
                    className="font-mono text-xs bg-stone-900 text-white px-4 py-2 rounded-xl hover:bg-stone-700 active:scale-95 transition-all disabled:opacity-30 disabled:cursor-not-allowed">Add</button>
                </form>
              </div>
            </div>

            <div className="px-6 py-4 border-t border-stone-100 flex items-center justify-between">
              <p className="font-mono text-[10px] text-stone-400">
                <span className="text-red-400">*</span> required · changes save automatically
              </p>
              <button onClick={handleSave}
                className={`font-mono text-xs px-4 py-2 rounded-xl transition-all ${
                  saveSuccess
                    ? 'bg-emerald-600 text-white border border-emerald-600'
                    : 'text-stone-700 border border-stone-300 bg-white hover:bg-stone-900 hover:text-white hover:border-stone-900'
                }`}>
                {saveSuccess ? '✓ Saved' : 'Save & close'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ── TaskCard ─────────────────────────────────────── */
    function TaskCard({ task, onMove, onDelete, onEdit, onOpenDetail, onDragStart, onDragEnd, isDragging }) {
      const idx = STATUSES.indexOf(task.status);
      const showDate = task.status !== 'done';
      const formattedDate = showDate ? formatDate(task.dueDate) : null;
      const overdue = showDate && isOverdue(task.dueDate);

      const [editing, setEditing] = React.useState(false);
      const [draft, setDraft] = React.useState('');
      const [confirmDelete, setConfirmDelete] = React.useState(false);
      const inputRef = React.useRef(null);

      const completedSubtasks = task.subtasks.filter(s => s.done).length;
      const totalSubtasks = task.subtasks.length;

      function startEdit(e) {
        e.stopPropagation();
        setDraft(task.title);
        setEditing(true);
        setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
      }

      function saveEdit() {
        onEdit(task.id, draft);
        if (draft.trim()) setEditing(false);
      }

      function handleKeyDown(e) {
        if (e.key === 'Enter') saveEdit();
        if (e.key === 'Escape') setEditing(false);
      }

      const TrashIcon = () => (
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M1.5 3h9M4.5 3V2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v1M5 5.5v3M7 5.5v3M2.5 3l.5 7a.5.5 0 0 0 .5.5h5a.5.5 0 0 0 .5-.5l.5-7" stroke="currentColor" strokeWidth="1.15" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );

      return (
        <div
          className={`task-card card-enter bg-white rounded-xl px-4 py-3 shadow-sm border border-stone-100 ${isDragging ? 'dragging' : ''}`}
          draggable={!editing && !confirmDelete}
          onDragStart={e => { e.dataTransfer.effectAllowed = 'move'; onDragStart(task.id); }}
          onDragEnd={onDragEnd}
        >
          {confirmDelete ? (
            <div className="flex items-center justify-between gap-2 py-0.5">
              <p className="font-mono text-xs text-stone-500">Permanently delete this task?</p>
              <div className="flex items-center gap-1.5 shrink-0">
                <button onClick={e => { e.stopPropagation(); setConfirmDelete(false); }}
                  className="font-mono text-[11px] px-2.5 py-1 rounded-lg border border-stone-200 text-stone-500 hover:bg-stone-100 transition-colors">Cancel</button>
                <button onClick={e => { e.stopPropagation(); onDelete(task.id); }}
                  className="font-mono text-[11px] px-2.5 py-1 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors">Delete</button>
              </div>
            </div>
          ) : (
            <>
              <div className="flex items-start gap-3">
                {editing ? (
                  <input ref={inputRef} type="text" value={draft} onChange={e => setDraft(e.target.value)}
                    onKeyDown={handleKeyDown} onClick={e => e.stopPropagation()}
                    className="flex-1 font-mono text-sm bg-stone-50 border border-stone-200 rounded-lg px-2 py-0.5 text-stone-700 min-w-0" />
                ) : (
                  <button onClick={() => onOpenDetail(task)}
                    className="flex-1 font-mono text-sm text-stone-700 leading-snug pt-0.5 break-words min-w-0 text-left hover:text-stone-900 transition-colors"
                    title="Open task detail">
                    {task.title}
                  </button>
                )}
                <span className={`font-mono text-[10px] font-medium px-2 py-0.5 rounded-full shrink-0 mt-0.5 ${(PRIORITY_META[task.priority] || PRIORITY_META['medium']).badgeClass}`}>
                  {(PRIORITY_META[task.priority] || PRIORITY_META['medium']).label}
                </span>
                <div className="flex items-center gap-1 shrink-0">
                  {editing ? (
                    <button onClick={saveEdit}
                      className="font-mono text-[11px] font-medium px-2 py-1 rounded-lg bg-stone-900 text-white hover:bg-stone-700 transition-colors">Save</button>
                  ) : (
                    <>
                      <button onClick={startEdit} title="Edit title"
                        className="w-7 h-7 flex items-center justify-center rounded-lg text-stone-400 hover:bg-stone-100 hover:text-stone-600 transition-colors">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                          <path d="M8.5 1.5a1.414 1.414 0 0 1 2 2L3.5 10.5 1 11l.5-2.5 7-7z" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>
                      </button>
                      <button onClick={e => { e.stopPropagation(); onMove(task.id, 'left'); }} disabled={idx === 0} title="Move left"
                        className="w-7 h-7 flex items-center justify-center rounded-lg text-stone-400 hover:bg-stone-100 hover:text-stone-600 disabled:opacity-20 disabled:cursor-not-allowed transition-colors">←</button>
                      <button onClick={e => { e.stopPropagation(); onMove(task.id, 'right'); }} disabled={idx === STATUSES.length - 1} title="Move right"
                        className="w-7 h-7 flex items-center justify-center rounded-lg text-stone-400 hover:bg-stone-100 hover:text-stone-600 disabled:opacity-20 disabled:cursor-not-allowed transition-colors">→</button>
                      <button onClick={e => { e.stopPropagation(); setConfirmDelete(true); }} title="Delete task"
                        className="w-7 h-7 flex items-center justify-center rounded-lg text-stone-300 hover:bg-red-50 hover:text-red-400 transition-colors ml-0.5">
                        <TrashIcon />
                      </button>
                    </>
                  )}
                </div>
              </div>

              <div className="flex items-center gap-3 mt-1.5 flex-wrap">
                {isScored(task) && (() => {
                  const q = quadrantOf(task);
                  const m = QUADRANT_META[q];
                  return (
                    <span className={`font-mono text-[10px] font-medium px-2 py-0.5 rounded-full ${m.chipClass}`}
                      title={`${m.label} — impact ${task.impact}/5, effort ${task.effort}/5`}>
                      I{task.impact}·E{task.effort}
                    </span>
                  );
                })()}
                {formattedDate && (
                  <div className={`flex items-center gap-1 font-mono text-[11px] ${overdue ? 'text-red-500' : 'text-stone-400'}`}>
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
                      <rect x="1" y="2" width="10" height="9" rx="1.5" stroke="currentColor" strokeWidth="1.2" fill="none"/>
                      <line x1="4" y1="1" x2="4" y2="3" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                      <line x1="8" y1="1" x2="8" y2="3" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                      <line x1="1" y1="5" x2="11" y2="5" stroke="currentColor" strokeWidth="1"/>
                    </svg>
                    {formattedDate}
                  </div>
                )}
                {totalSubtasks > 0 && (
                  <div className="flex items-center gap-1.5 font-mono text-[11px] text-stone-400">
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
                      <rect x="1" y="1" width="4" height="4" rx="1" stroke="currentColor" strokeWidth="1.1" fill="none"/>
                      <path d="M2.5 3l.8.8 1.7-1.7" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round" strokeLinejoin="round"/>
                      <rect x="7" y="1" width="4" height="4" rx="1" stroke="currentColor" strokeWidth="1.1" fill="none"/>
                      <rect x="1" y="7" width="4" height="4" rx="1" stroke="currentColor" strokeWidth="1.1" fill="none"/>
                      <rect x="7" y="7" width="4" height="4" rx="1" stroke="currentColor" strokeWidth="1.1" fill="none"/>
                    </svg>
                    {completedSubtasks}/{totalSubtasks}
                  </div>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    /* ── Column ───────────────────────────────────────── */
    function Column({ status, tasks, onMove, onDelete, onEdit, onOpenDetail, onDragStart, onDragEnd, onDrop, draggingId }) {
      const { label, colClass, badgeClass } = COLUMN_META[status];
      const [isDragOver, setIsDragOver] = React.useState(false);
      const dragCounter = React.useRef(0);

      function handleDragEnter(e) { e.preventDefault(); dragCounter.current += 1; setIsDragOver(true); }
      function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
      function handleDragLeave(e) { dragCounter.current -= 1; if (dragCounter.current === 0) setIsDragOver(false); }
      function handleDrop(e) { e.preventDefault(); dragCounter.current = 0; setIsDragOver(false); onDrop(status); }

      return (
        <div
          className={`column-drop-target flex flex-col bg-stone-50 rounded-2xl shadow-sm border border-stone-200 ${colClass} ${isDragOver ? 'drag-over' : ''}`}
          onDragEnter={handleDragEnter} onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop}
        >
          <div className="flex items-center justify-between px-5 py-4 border-b border-stone-100 rounded-t-2xl overflow-hidden">
            <h2 className="font-display font-700 text-stone-800 text-base tracking-tight">{label}</h2>
            <span className={`font-mono text-xs font-medium px-2.5 py-0.5 rounded-full ${badgeClass}`}>{tasks.length}</span>
          </div>
          <div className="flex flex-col gap-2.5 p-4 flex-1 min-h-32">
            {tasks.length === 0 && (
              <p className="text-xs font-mono text-stone-300 text-center mt-6">{isDragOver ? 'Drop here' : 'empty'}</p>
            )}
            {tasks.map(task => (
              <TaskCard key={task.id} task={task} onMove={onMove} onDelete={onDelete} onEdit={onEdit}
                onOpenDetail={onOpenDetail} onDragStart={onDragStart} onDragEnd={onDragEnd}
                isDragging={draggingId === task.id} />
            ))}
          </div>
        </div>
      );
    }

    /* ── ErrorBanner ──────────────────────────────────── */
    function ErrorBanner({ message, onClose }) {
      if (!message) return null;
      return (
        <div className="flex items-center justify-between bg-red-600 text-white font-mono text-sm px-5 py-3 rounded-xl mb-6 shadow-sm">
          <span>{message}</span>
          <button onClick={onClose}
            className="ml-4 w-6 h-6 flex items-center justify-center rounded-md hover:bg-red-500 transition-colors text-white text-base leading-none"
            title="Dismiss">×</button>
        </div>
      );
    }

    /* ── Priority Matrix ──────────────────────────────── */
    function MatrixView({ tasks, onOpenTask }) {
      const active   = tasks.filter(t => t.status !== 'done');
      const scored   = active.filter(isScored);
      const unscored = active.filter(t => !isScored(t));

      // Tasks sharing an impact/effort cell fan out around the cell centre
      const cells = {};
      scored.forEach(t => {
        const key = `${t.impact}-${t.effort}`;
        (cells[key] = cells[key] || []).push(t);
      });

      const PAD = 8; // % inset so extreme scores don't touch the plot edge
      function posOf(t) {
        const group = cells[`${t.impact}-${t.effort}`];
        const idx = group.indexOf(t);
        const x = PAD + ((t.effort - 1) / 4) * (100 - PAD * 2);
        const y = PAD + ((5 - t.impact) / 4) * (100 - PAD * 2);
        if (group.length === 1) return { x, y };
        const angle = (2 * Math.PI * idx) / group.length - Math.PI / 2;
        return { x: x + Math.cos(angle) * 3, y: y + Math.sin(angle) * 4.5 };
      }

      const counts = { quickwin: 0, bigbet: 0, fillin: 0, timesink: 0 };
      scored.forEach(t => { counts[quadrantOf(t)] += 1; });

      const truncate = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;

      return (
        <div className="card-enter bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
          {/* Header + legend */}
          <div className="flex items-center justify-between gap-3 flex-wrap px-6 py-4 border-b border-stone-100">
            <div>
              <h2 className="font-display font-700 text-stone-800 text-base tracking-tight">Priority Matrix</h2>
              <p className="font-mono text-[11px] text-stone-400 mt-0.5">
                impact vs effort · {scored.length} of {active.length} active tasks scored
              </p>
            </div>
            <div className="flex gap-2 flex-wrap">
              {Object.keys(QUADRANT_META).map(q => (
                <span key={q} className={`font-mono text-[10px] font-medium px-2 py-0.5 rounded-full ${QUADRANT_META[q].chipClass}`}>
                  {QUADRANT_META[q].label} · {counts[q]}
                </span>
              ))}
            </div>
          </div>

          {/* Plot */}
          <div className="px-5 pt-5 pb-3">
            <div className="flex gap-2">
              <div className="flex items-center shrink-0">
                <span className="font-mono text-[10px] text-stone-400" style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)' }}>
                  Impact ↑
                </span>
              </div>
              <div className="relative flex-1" style={{ aspectRatio: '16 / 10' }}>
                {/* Quadrant tints */}
                <div className="absolute inset-0 grid grid-cols-2 grid-rows-2 rounded-xl overflow-hidden border border-stone-200">
                  <div style={{ background: QUADRANT_META.quickwin.tint }} />
                  <div style={{ background: QUADRANT_META.bigbet.tint }} />
                  <div style={{ background: QUADRANT_META.fillin.tint }} />
                  <div style={{ background: QUADRANT_META.timesink.tint }} />
                </div>
                {/* Midlines */}
                <div className="absolute left-1/2 top-1 bottom-1 border-l border-dashed border-stone-300" />
                <div className="absolute top-1/2 left-1 right-1 border-t border-dashed border-stone-300" />
                {/* Corner labels */}
                <span className="matrix-corner" style={{ top: 10, left: 14, color: QUADRANT_META.quickwin.labelColor }}>Quick wins</span>
                <span className="matrix-corner" style={{ top: 10, right: 14, color: QUADRANT_META.bigbet.labelColor }}>Big bets</span>
                <span className="matrix-corner" style={{ bottom: 10, left: 14, color: QUADRANT_META.fillin.labelColor }}>Fill-ins</span>
                <span className="matrix-corner" style={{ bottom: 10, right: 14, color: QUADRANT_META.timesink.labelColor }}>Time sinks</span>

                {scored.length === 0 && (
                  <div className="absolute inset-0 flex items-center justify-center">
                    <p className="font-mono text-xs text-stone-400 text-center px-8">
                      No scored tasks yet — open a task and set impact and effort (or let AI suggest them).
                    </p>
                  </div>
                )}

                {/* Task dots */}
                {scored.map(t => {
                  const { x, y } = posOf(t);
                  const q = quadrantOf(t);
                  const m = QUADRANT_META[q];
                  const overdue = isOverdue(t.dueDate);
                  const inProgress = t.status === 'inprogress';
                  return (
                    <button
                      key={t.id}
                      className="matrix-dot"
                      style={{ left: x + '%', top: y + '%' }}
                      onClick={() => onOpenTask(t)}
                      title={`${t.title} — impact ${t.impact}/5 · effort ${t.effort}/5 · ${COLUMN_META[t.status].label}${overdue ? ' · OVERDUE' : ''}`}
                    >
                      <span className="dot" style={{
                        background: m.dot,
                        boxShadow: inProgress ? `0 0 0 3.5px ${m.dot}40` : '0 1px 4px rgba(0,0,0,0.15)',
                      }}>
                        {overdue && <span className="dot-overdue" />}
                      </span>
                      <span className={`dot-label${t.effort >= 4 ? ' left' : ''}`}>{truncate(t.title, 26)}</span>
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="flex items-center justify-between mt-2 pl-6 pr-1">
              <span className="font-mono text-[10px] text-stone-400">← low effort</span>
              <span className="font-mono text-[10px] text-stone-400">ring = in progress · red dot = overdue</span>
              <span className="font-mono text-[10px] text-stone-400">high effort →</span>
            </div>
          </div>

          {/* Unscored tasks */}
          {unscored.length > 0 && (
            <div className="border-t border-stone-100 bg-stone-50 px-6 py-4">
              <p className="font-mono text-[11px] text-stone-400 uppercase tracking-widest mb-2.5">
                Needs scoring · {unscored.length}
              </p>
              <div className="flex flex-wrap gap-2">
                {unscored.map(t => (
                  <button key={t.id} onClick={() => onOpenTask(t)}
                    className="font-mono text-xs bg-white border border-amber-200 text-stone-600 px-3 py-1.5 rounded-lg hover:border-amber-400 hover:bg-amber-50 transition-colors">
                    {t.title} <span className="text-amber-600 ml-1">score →</span>
                  </button>
                ))}
              </div>
              <p className="font-mono text-[10px] text-stone-400 mt-2.5">
                Tip: open a task and hit <span className="text-amber-700">AI suggest</span> to score it in one click.
              </p>
            </div>
          )}
        </div>
      );
    }

    /* ── TaskBoard ────────────────────────────────────── */
    function TaskBoard({ user, isDemo = false, onExitDemo }) {
      const [tasks, setTasks] = React.useState(isDemo ? DEMO_TASKS : []);
      const [loading, setLoading] = React.useState(!isDemo);
      const [input, setInput] = React.useState('');
      const [error, setError] = React.useState('');
      const [aiLoading, setAiLoading] = React.useState(false);
      const [aiRecord, setAiRecord] = React.useState(null);
      const [sprintSetupOpen, setSprintSetupOpen] = React.useState(false);
      const [sprintCapacity, setSprintCapacity] = React.useState(10);
      const [detailTask, setDetailTask] = React.useState(null);
      const [overdueFilter, setOverdueFilter] = React.useState(false);
      const [view, setView] = React.useState(() => {
        const v = new URLSearchParams(window.location.search).get('view');
        return ['board', 'matrix'].includes(v) ? v : 'board';
      });
      const [draggingId, setDraggingId] = React.useState(null);
      const draggingIdRef = React.useRef(null);
      const errorTimerRef = React.useRef(null);

      function showError(msg) {
        setError(msg);
        clearTimeout(errorTimerRef.current);
        errorTimerRef.current = setTimeout(() => setError(''), 3000);
      }

      function dismissError() {
        clearTimeout(errorTimerRef.current);
        setError('');
      }

      React.useEffect(() => {
        if (isDemo) return; // skip DB fetch in demo mode
        async function fetchTasks() {
          const { data, error } = await sb.from('tasks').select('*').order('created_at', { ascending: false });
          if (error) showError('Failed to load tasks: ' + error.message);
          else setTasks(data.map(rowToTask));
          setLoading(false);
        }
        fetchTasks();
      }, [isDemo]);

      const analysisKey = 'taskboard:analysis:' + (isDemo ? 'demo' : user.id);

      React.useEffect(() => {
        try {
          const raw = localStorage.getItem(analysisKey);
          if (raw) {
            const rec = JSON.parse(raw);
            if (rec && rec.mode && rec.result && Array.isArray(rec.taskIds)) setAiRecord(rec);
          }
        } catch (_) { /* corrupt record — start fresh */ }
      }, []);

      async function runAnalysis(mode, capacity) {
        if (aiLoading) return;
        setSprintSetupOpen(false);
        setAiLoading(true);
        const active = tasks.filter(t => t.status !== 'done');
        if (active.length === 0) {
          showError('No active tasks to analyze.');
          setAiLoading(false);
          return;
        }
        try {
          const result = mode === 'sprint'
            ? await fetchSprintPlan(active, capacity)
            : await fetchRankAnalysis(active);
          const record = {
            mode,
            result,
            capacity: mode === 'sprint' ? capacity : null,
            taskIds: active.map(t => t.id),
            analyzedAt: new Date().toISOString(),
            snapshot: planSignature(tasks),
          };
          setAiRecord(record);
          try { localStorage.setItem(analysisKey, JSON.stringify(record)); } catch (_) {}
        } catch (err) {
          showError((mode === 'sprint' ? 'Sprint planning' : 'AI prioritization') + ' failed: ' + err.message);
        }
        setAiLoading(false);
      }

      function dismissAnalysis() {
        setAiRecord(null);
        try { localStorage.removeItem(analysisKey); } catch (_) {}
      }

      function rerunAnalysis() {
        if (!aiRecord) return;
        runAnalysis(aiRecord.mode, aiRecord.capacity || sprintCapacity);
      }

      function openTaskById(id) {
        const t = tasks.find(x => x.id === id);
        if (t) setDetailTask(t);
      }

      async function addTask(e) {
        e.preventDefault();
        const title = input.trim();
        if (!title) { showError('Title cannot be empty.'); return; }

        if (isDemo) {
          // Demo: state-only
          const created = {
            id: uid(),
            title,
            status: 'todo',
            priority: 'low',
            dueDate: '',
            description: '',
            subtasks: [],
          };
          setTasks(prev => [created, ...prev]);
          setInput('');
          setDetailTask(created);
          return;
        }

        const newRow = { title, status: 'todo', priority: 'low', due_date: null };
        const { data, error } = await sb.from('tasks').insert(newRow).select().single();
        if (error) { showError('Failed to add task: ' + error.message); return; }
        const created = rowToTask(data);
        setTasks(prev => [created, ...prev]);
        setInput('');
        setDetailTask(created);
      }

      async function moveTask(id, direction) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        const idx = STATUSES.indexOf(task.status);
        const nextIdx = direction === 'left' ? idx - 1 : idx + 1;
        if (nextIdx < 0 || nextIdx >= STATUSES.length) return;
        const nextStatus = STATUSES[nextIdx];
        setTasks(prev => prev.map(t => t.id === id ? { ...t, status: nextStatus } : t));
        if (isDemo) return;
        const { error } = await sb.from('tasks').update({ status: nextStatus }).eq('id', id);
        if (error) {
          setTasks(prev => prev.map(t => t.id === id ? { ...t, status: task.status } : t));
          showError('Failed to move task: ' + error.message);
        }
      }

      async function moveTaskToStatus(id, status) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        setTasks(prev => prev.map(t => t.id === id ? { ...t, status } : t));
        if (isDemo) return;
        const { error } = await sb.from('tasks').update({ status }).eq('id', id);
        if (error) {
          setTasks(prev => prev.map(t => t.id === id ? { ...t, status: task.status } : t));
          showError('Failed to update task status: ' + error.message);
        }
      }

      async function dragDropTask(id, targetStatus) {
        const task = tasks.find(t => t.id === id);
        if (!task || task.status === targetStatus) return;
        setTasks(prev => prev.map(t => t.id === id ? { ...t, status: targetStatus } : t));
        if (isDemo) return;
        const { error } = await sb.from('tasks').update({ status: targetStatus }).eq('id', id);
        if (error) {
          setTasks(prev => prev.map(t => t.id === id ? { ...t, status: task.status } : t));
          showError('Failed to move task: ' + error.message);
        }
      }

      async function deleteTask(id) {
        const snapshot = tasks;
        setTasks(prev => prev.filter(t => t.id !== id));
        if (isDemo) return;
        const { error } = await sb.from('tasks').delete().eq('id', id);
        if (error) {
          setTasks(snapshot);
          showError('Failed to delete task: ' + error.message);
        }
      }

      async function editTask(id, newTitle) {
        const title = newTitle.trim();
        if (!title) { showError('Title cannot be empty.'); return; }
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        setTasks(prev => prev.map(t => t.id === id ? { ...t, title } : t));
        if (isDemo) return;
        const { error } = await sb.from('tasks').update({ title }).eq('id', id);
        if (error) {
          setTasks(prev => prev.map(t => t.id === id ? { ...t, title: task.title } : t));
          showError('Failed to update task: ' + error.message);
        }
      }

      async function patchTask(id, patch) {
        function applyPatch(t) {
          const updated = { ...t };
          if ('title' in patch)       updated.title       = patch.title;
          if ('priority' in patch)    updated.priority    = patch.priority;
          if ('due_date' in patch)    updated.dueDate     = patch.due_date || '';
